name: Hourly Digest Bot

on:
  schedule:
    - cron: '0 3,8,12,15 * * *' # Runs at 8:30 AM, 1:30 PM, 5:30 PM, and 8:30 PM IST (3:00, 8:00, 12:00, 15:00 UTC)
  workflow_dispatch: # Allows manual trigger on GitHub web UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write # Required to push SQLite database updates back to the repository

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Requirements
      run: |
        pip install -r requirements.txt

    - name: Recreate Config Files from Secrets
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
        CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      run: |
        echo "$ENV_FILE" > .env
        echo "$CLIENT_SECRETS_JSON" > client_secrets.json
        echo "$TOKEN_JSON" > token.json

    - name: Run Bot Pipeline
      run: |
        python main.py --digest

    - name: Commit and Push Database State Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add bot_database.sqlite
        git diff-index --quiet HEAD || (git commit -m "chore: update database state [skip ci]" && git pull --rebase && git push)
