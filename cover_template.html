<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>News Cover Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'news-red': '#FF2D2D',
                        'news-yellow': '#FFC300',
                        'news-dark': '#0a0508',
                    },
                    fontFamily: {
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'red-glow': '0 0 20px rgba(255, 45, 45, 0.6)',
                        'red-glow-strong': '0 0 30px rgba(255, 45, 45, 0.8), inset 0 0 10px rgba(255, 45, 45, 0.5)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: #111;
        }
        
        .instagram-canvas {
            width: 1080px;
            height: 1350px;
            position: relative;
            background-color: #000;
            background-image: url('https://images.pexels.com/photos/1688151/pexels-photo-1688151.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            color: white;
            transform-origin: top center;
        }

        /* Responsive scaling for previewing on smaller screens */
        @media (max-width: 1100px) {
            .instagram-canvas {
                transform: scale(0.5);
                margin-top: -337px;
                margin-bottom: -337px;
            }
        }

        /* Cinematic Vignette Overlay */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 90%),
                        linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
        }

        /* Halftone dot pattern top left/right */
        .halftone {
            position: absolute;
            top: -50px;
            width: 400px;
            height: 400px;
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
            background-size: 12px 12px;
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            z-index: 2;
        }
        .halftone-left { left: -50px; }
        .halftone-right { right: -50px; }

        .content-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 50px 60px;
        }

        /* Text Grain Texture */
        .grain-text {
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.15"/%3E%3C/svg%3E');
            -webkit-background-clip: text;
            background-clip: text;
            position: relative;
        }

        .motion-lines {
            position: absolute;
            right: -250px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            opacity: 0.8;
        }
        .motion-line {
            height: 12px;
            background: linear-gradient(to right, #FF2D2D, transparent);
            border-radius: 6px;
        }

        .skewed-box {
            transform: skewX(-10deg);
        }
        .skewed-text {
            transform: skewX(10deg);
        }

        .icon-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid rgba(255, 45, 45, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 15px rgba(255, 45, 45, 0.6), inset 0 0 15px rgba(255, 45, 45, 0.4);
            background: rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="instagram-canvas font-inter">
        <!-- Background Effects -->
        <div class="vignette-overlay"></div>
        <div class="halftone halftone-left"></div>
        <div class="halftone halftone-right"></div>

        <div class="content-layer">
            
            <!-- HEADER SECTION -->
            <div class="flex justify-between items-start w-full">
                <!-- Logo Left -->
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 rounded-full border border-news-red flex items-center justify-center shadow-red-glow bg-black relative">
                        <img src="https://ui-avatars.com/api/?name=N+F&color=fff&background=000" class="w-16 h-16 rounded-full opacity-80" alt="Logo">
                    </div>
                    <div class="flex flex-col font-inter font-bold leading-none uppercase tracking-wide">
                        <span class="text-4xl text-white">News</span>
                        <span class="text-4xl text-news-red mt-1">Flash5</span>
                    </div>
                </div>

                <!-- Badge Right -->
                <div class="flex flex-col items-end">
                    <div class="flex flex-col w-48 shadow-lg transform rotate-2">
                        <div class="bg-news-red text-white text-center font-bold text-xl py-1 uppercase tracking-wider">Breaking</div>
                        <div class="bg-white text-black text-center font-black text-3xl py-1 uppercase tracking-widest italic">News</div>
                    </div>
                    <div class="bg-news-red text-white font-bold text-lg px-4 py-1 rounded-full mt-2 flex items-center gap-2 transform rotate-2 shadow-red-glow">
                        <div class="w-3 h-3 bg-white rounded-full"></div>
                        LIVE
                    </div>
                </div>
            </div>

            <!-- MAIN HEADLINE -->
            <div class="mt-40 flex flex-col items-center justify-center relative w-full">
                
                <div class="flex items-end justify-center w-full relative">
                    <!-- Giant Number -->
                    <div class="font-bebas text-[450px] leading-[0.75] text-white grain-text transform -translate-y-6">
                        5
                    </div>
                    
                    <!-- BIG STORIES -->
                    <div class="flex flex-col pb-4 relative ml-4">
                        <div class="font-bebas text-[150px] leading-[0.8] text-white tracking-wide grain-text">
                            BIG
                        </div>
                        <div class="font-bebas text-[170px] leading-[0.8] text-news-yellow tracking-wide grain-text relative z-10">
                            STORIES
                            <!-- Motion lines -->
                            <div class="motion-lines">
                                <div class="motion-line w-40"></div>
                                <div class="motion-line w-64"></div>
                                <div class="motion-line w-48"></div>
                                <div class="motion-line w-56"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- IN 60 SECONDS (Red Box) -->
                <div class="bg-news-red skewed-box px-8 py-2 mt-4 inline-block shadow-lg">
                    <div class="font-bebas text-[80px] leading-none text-white skewed-text tracking-widest">
                        IN <span class="text-news-yellow">60</span> SECONDS
                    </div>
                </div>

            </div>

            <!-- DIVIDER -->
            <div class="flex items-center justify-center gap-6 mt-16 mb-12 w-full px-10">
                <div class="h-1 bg-white/40 flex-1"></div>
                <div class="font-inter font-bold italic text-white text-2xl tracking-widest flex gap-4">
                    <span>FAST</span>
                    <span class="text-news-red">•</span>
                    <span>FACTUAL</span>
                    <span class="text-news-red">•</span>
                    <span>ESSENTIAL</span>
                </div>
                <div class="h-1 bg-white/40 flex-1"></div>
            </div>

            <!-- ICONS ROW -->
            <div class="flex justify-between items-start w-full px-4 mt-8">
                <!-- Icon 1 -->
                <div class="flex flex-col items-center w-[180px] text-center">
                    <div class="icon-circle"><i class="fa-solid fa-globe"></i></div>
                    <div class="text-white font-bold text-xl uppercase leading-tight mt-2">Global<br>Updates</div>
                </div>
                <!-- Divider -->
                <div class="h-24 w-px bg-white/20 mt-4"></div>
                
                <!-- Icon 2 -->
                <div class="flex flex-col items-center w-[180px] text-center">
                    <div class="icon-circle"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="text-white font-bold text-xl uppercase leading-tight mt-2">Politics &<br>Governance</div>
                </div>
                <!-- Divider -->
                <div class="h-24 w-px bg-white/20 mt-4"></div>
                
                <!-- Icon 3 -->
                <div class="flex flex-col items-center w-[180px] text-center">
                    <div class="icon-circle"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div class="text-white font-bold text-xl uppercase leading-tight mt-2">Economy<br>In Focus</div>
                </div>
                <!-- Divider -->
                <div class="h-24 w-px bg-white/20 mt-4"></div>

                <!-- Icon 4 -->
                <div class="flex flex-col items-center w-[180px] text-center">
                    <div class="icon-circle"><i class="fa-solid fa-users"></i></div>
                    <div class="text-white font-bold text-xl uppercase leading-tight mt-2">People &<br>Society</div>
                </div>
                <!-- Divider -->
                <div class="h-24 w-px bg-white/20 mt-4"></div>

                <!-- Icon 5 -->
                <div class="flex flex-col items-center w-[180px] text-center">
                    <div class="icon-circle"><i class="fa-solid fa-bullhorn"></i></div>
                    <div class="text-white font-bold text-xl uppercase leading-tight mt-2">More Stories<br>Inside</div>
                </div>
            </div>

            <!-- ENGAGEMENT HOOK -->
            <div class="w-full flex justify-center mt-20">
                <div class="border-2 border-news-red shadow-red-glow-strong bg-black/80 rounded-2xl py-6 px-10 flex items-center gap-8 relative overflow-hidden">
                    <!-- Red motion lines behind hook -->
                    <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMCI+PHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2ZmMiIgLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9InRyYW5zcGFyZW50IiAvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI1IiBmaWxsPSJ1cmwoI2cpIi8+PC9zdmc+')] background-repeat-y"></div>
                    
                    <div class="text-news-red text-6xl shadow-red-glow relative z-10"><i class="fa-solid fa-stopwatch"></i></div>
                    <div class="flex flex-col justify-center relative z-10">
                        <div class="font-inter font-black italic text-4xl text-white tracking-wide">WAIT TILL YOU SEE</div>
                        <div class="font-inter font-black italic text-5xl text-news-yellow tracking-wide mt-1">THE LAST ONE...</div>
                    </div>
                    <div class="text-news-red text-6xl ml-4 shadow-red-glow relative z-10"><i class="fa-solid fa-angles-right"></i></div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="w-full flex justify-center items-center gap-4 mt-16 text-white/80 font-inter font-bold text-2xl uppercase tracking-widest">
                <i class="fa-regular fa-calendar text-news-red"></i>
                <span>Updated: 01 May 2026</span>
                <span class="text-news-yellow mx-2">|</span>
                <i class="fa-regular fa-clock text-news-red"></i>
                <span>00:58</span>
            </div>

            <!-- BOTTOM CTA -->
            <div class="w-full flex justify-center mt-10">
                <div class="border-4 border-news-red rounded-full py-6 px-16 bg-black shadow-red-glow-strong flex items-center justify-center gap-6">
                    <span class="font-inter font-bold text-4xl text-white uppercase tracking-widest">Watch Full Breakdown</span>
                    <i class="fa-solid fa-angles-right text-news-red text-4xl"></i>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
